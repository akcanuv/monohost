<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/dashboard/">
<title>monohost · 404</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&family=IBM+Plex+Sans:wght@0,400;0,500;0,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
  --p-white:#FFFFFF; --p-grey-50:#f9fafb; --p-grey-100:#f3f4f6; --p-grey-200:#dce0e4;
  --p-grey-400:#9ca6af; --p-grey-500:#6b7580; --p-grey-600:#4b5963; --p-grey-900:#111c27;
  --p-blue-800:#1962b4; --p-blue-900:#1a548e; --p-green-700:#227328; --p-red-700:#d40c0c;
  --surface-page:var(--p-white); --surface-card:var(--p-grey-50);
  --border-default:var(--p-grey-200);
  --text-primary:var(--p-grey-900); --text-secondary:var(--p-grey-600); --text-tertiary:var(--p-grey-500);
  --accent:var(--p-blue-800); --accent-hover:var(--p-blue-900); --alert:var(--p-red-700); --success:var(--p-green-700);
  --font-display:"Inter Tight",ui-sans-serif,system-ui,sans-serif;
  --font-sans:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
  --tracking-widish:0.08em; --ease-rise:cubic-bezier(0.22,1,0.36,1); --dur-base:150ms;
}
* { box-sizing:border-box; border-radius:0 !important; }
html, body { height:100%; }
body { margin:0; background:var(--surface-page); color:var(--text-primary); font-family:var(--font-sans);
  font-size:13px; line-height:1.55; -webkit-font-smoothing:antialiased; font-feature-settings:"ss01","cv11";
  display:flex; flex-direction:column; min-height:100%; }
::selection { background:var(--accent); color:#fff; }
a { color:inherit; text-decoration:none; }
.label { font-family:var(--font-sans); font-size:10.5px; letter-spacing:var(--tracking-widish);
  text-transform:uppercase; color:var(--text-tertiary); font-weight:500; }
.mono { font-family:var(--font-mono); }
@keyframes rise { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.rise { animation:rise .5s var(--ease-rise) both; }
@keyframes blink { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }

.crumb { height:40px; border-bottom:1px solid var(--text-primary); display:flex; align-items:center;
  gap:12px; padding:0 28px; font-size:11px; flex:0 0 auto; }
.crumb img { height:22px; width:auto; }
.crumb .sep { color:var(--border-default); }
.crumb .name { font-weight:500; }
.crumb a.back { margin-left:auto; font-family:var(--font-mono); color:var(--accent); }
.crumb a.back:hover { text-decoration:underline; }

.stage { flex:1 1 auto; display:flex; align-items:center; justify-content:center; padding:48px 28px; }
.panel { width:100%; max-width:680px; }

.over { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
.over .flex { flex:1; height:1px; background:var(--border-default); }
.squares { display:flex; gap:4px; }
.sq { width:8px; height:8px; background:var(--border-default); }
.sq.on { background:var(--alert); }

.code { font-family:var(--font-mono); font-weight:700; letter-spacing:-0.05em;
  font-size:clamp(96px,22vw,200px); line-height:0.82; margin:0;
  border-bottom:1px solid var(--text-primary); padding-bottom:20px; }
.code .cursor { color:var(--accent); animation:blink 1.1s steps(1) infinite; }

.gloss { display:flex; gap:28px; margin-top:20px; flex-wrap:wrap; align-items:baseline; }
.gloss h2 { margin:0; font-family:var(--font-display); font-weight:500; font-size:clamp(22px,3.4vw,30px);
  letter-spacing:-0.02em; line-height:1.05; flex:1 1 320px; }
.gloss p { margin:0; color:var(--text-secondary); max-width:42ch; font-size:13px; }
.gloss code { font-family:var(--font-mono); color:var(--accent); font-size:12px; word-break:break-all; }

.meta { margin-top:26px; border:1px solid var(--border-default); }
.meta-row { display:flex; justify-content:space-between; align-items:center; gap:16px;
  padding:9px 14px; border-bottom:1px solid var(--border-default); }
.meta-row:last-child { border-bottom:0; }
.meta-row .k { font-size:10px; letter-spacing:var(--tracking-widish); text-transform:uppercase;
  color:var(--text-tertiary); font-weight:500; }
.meta-row .v { font-family:var(--font-mono); font-size:12px; color:var(--text-primary); }
.meta-row .v.alert { color:var(--alert); }

.actions { margin-top:26px; display:flex; gap:12px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:8px; font-family:var(--font-sans); font-weight:500;
  text-transform:uppercase; letter-spacing:var(--tracking-widish); border:1px solid var(--accent); cursor:pointer;
  font-size:11px; padding:10px 18px; background:var(--accent); color:#fff;
  transition:background-color var(--dur-base),border-color var(--dur-base); }
.btn:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
.btn.ghost { background:none; color:var(--accent); }
.btn.ghost:hover { background:var(--surface-card); }
</style>
</head>
<body>
<div class="crumb">
  <img src="logo.png" alt="monohost">
  <span class="sep">/</span><span class="name">Not found</span>
  <a class="back" href=".">← dashboard</a>
</div>

<main class="stage">
  <div class="panel rise">
    <div class="over">
      <span class="label">monohost · routing</span>
      <span class="flex"></span>
      <span class="squares" aria-hidden="true">
        <span class="sq on"></span><span class="sq"></span><span class="sq on"></span>
        <span class="sq"></span><span class="sq on"></span>
      </span>
      <span class="label mono">HTTP 404</span>
    </div>

    <h1 class="code">404<span class="cursor">_</span></h1>

    <div class="gloss">
      <h2>No app answers at this route.</h2>
      <p>The path <code id="path">—</code> isn't mapped to any onboarded app.
      It may have been offboarded, renamed, or never minted.</p>
    </div>

    <div class="meta">
      <div class="meta-row"><span class="k">Status</span><span class="v alert">404 · not found</span></div>
      <div class="meta-row"><span class="k">Requested</span><span class="v" id="meta-path">—</span></div>
      <div class="meta-row"><span class="k">Host</span><span class="v" id="meta-host">—</span></div>
    </div>

    <div class="actions">
      <a class="btn" href=".">← Back to dashboard</a>
      <a class="btn ghost" href="new">Deploy an app →</a>
    </div>
  </div>
</main>

<script>
// Surface the path the visitor actually asked for (Caddy strips /dashboard,
// so reconstruct the public-facing route for an honest readout).
const raw = location.pathname + location.search;
const shown = raw.replace(/^\/dashboard/, '') || '/';
document.getElementById('path').textContent = shown;
document.getElementById('meta-path').textContent = shown;
document.getElementById('meta-host').textContent = location.host;
</script>
</body>
</html>
